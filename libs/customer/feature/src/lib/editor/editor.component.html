<!-- Leaving for a job workspace must not silently discard customer edits. -->
<div class="leave-backdrop" *ngIf="leavePrompt"><section class="leave-dialog" role="alertdialog" aria-modal="true" aria-labelledby="editor-leave-heading" cdkTrapFocus [cdkTrapFocusAutoCapture]="true" (keydown.escape)="resolveLeave(false)"><h2 id="editor-leave-heading">Unsaved customer changes</h2><p>Save the customer before leaving, or discard these changes.</p><button type="button" class="btn btn-primary" cdkFocusInitial (click)="resolveLeave(false)">Keep editing</button> <button type="button" class="btn btn-outline-danger" (click)="resolveLeave(true)">Discard changes</button></section></div>
<div class="editor-page" [inert]="leavePrompt">
  <div class="container page">
    <div class="prime-naked-card">
      <h2 style="text-align: center">
        {{ form.value.isLead ? 'Potential Customer' : 'Customer' }}
      </h2>
      <p *ngIf="error" role="alert">{{ error }}</p>
      <p *ngIf="notice" role="status">{{ notice }}</p>
      <div class="p-grid p-jc-center">
        <div class="p-col-12 p-md-5">
          <form [formGroup]="form" (ngSubmit)="submit()">
            <label class="form-group d-block"
              >Name<input
                class="form-control"
                formControlName="name"
                maxlength="200"
            /></label>
            <div *ngIf="custSlug">
              <h5>Avatar</h5>
              <img
                *ngIf="tcustomer?.avatar"
                [src]="tcustomer.avatar"
                alt="Customer avatar"
                style="max-width: 150px; max-height: 150px"
              /><label class="d-block"
                >Upload avatar<input
                  type="file"
                  accept="image/png,image/jpeg,image/gif,image/webp"
                  (change)="uploadAvatar($event)"
              /></label>
            </div>
            <label class="form-group d-block"
              >Phone<input class="form-control" formControlName="phone"
            /></label>
            <label class="form-group d-block"
              >Address<input class="form-control" formControlName="address"
            /></label>
            <label class="form-group d-block"
              >Email<input
                type="email"
                class="form-control"
                formControlName="email"
            /></label>
            <label class="form-group d-block"
              >Customer Description<textarea
                class="form-control"
                rows="4"
                formControlName="body"
              ></textarea>
            </label>
            <label class="d-block"
              ><input type="checkbox" formControlName="isLead" /> Is
              Lead?</label
            >
            <label class="d-block"
              ><input type="checkbox" formControlName="isActive" />
              Active</label
            >
            <label class="d-block"
              ><input type="checkbox" formControlName="isComplete" />
              Completed</label
            >
            <label class="d-block"
              ><input type="checkbox" formControlName="isArchived" /> Archived
              (clear to restore)</label
            >
            <button
              class="btn btn-primary"
              type="submit"
              [disabled]="form.invalid || busy"
            >
              Save
            </button>
          </form>
        </div>
        <div class="p-col-12 p-md-4 p-md-offset-1">
          <!-- Customer editing links to job workspaces without editing their details here. -->
          <h5>Jobs</h5>
          <ng-container *ngIf="custSlug; else saveCustomerFirst">
            <a *ngIf="!tcustomer?.isArchived" class="btn btn-outline-primary" routerLink="/job/new" [queryParams]="{customer: custSlug}">+ New job</a>
            <a *ngFor="let job of jobsList" class="d-block mt-3" [routerLink]="['/job', job.jobSlug]">{{ job.name }} →</a>
          </ng-container>
          <ng-template #saveCustomerFirst><p>To create a customer and job together, use the New Job page.</p><a class="btn btn-outline-primary" routerLink="/job/new">+ New job</a></ng-template>
        </div>
      </div>
    </div>
  </div>
</div>
