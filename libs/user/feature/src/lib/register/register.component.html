<div class="container prime-naked-card staff-card p-4">
  <h2>Staff accounts</h2>
  <p role="alert" *ngIf="error">{{ error }}</p>
  <ng-container *ngIf="$any(users.userInfo)?.role === 'admin'">
    <form (ngSubmit)="submit()" [formGroup]="form">
      <label class="d-block"
        >Name<input
          class="form-control"
          formControlName="username"
          autocomplete="off" /></label
      ><label class="d-block"
        >Email<input
          class="form-control"
          type="email"
          formControlName="email"
          autocomplete="off" /></label
      ><label class="d-block"
        >Temporary password (at least 12 characters)<input
          class="form-control"
          type="password"
          formControlName="password"
          autocomplete="new-password" /></label
      ><button
        class="btn btn-primary"
        type="submit"
        [disabled]="form.invalid || busy"
      >
        Create staff account
      </button>
    </form>
    <div
      class="staff-table-scroll mt-4"
      role="region"
      aria-label="Staff access"
      tabindex="0"
    >
      <table class="table staff-table">
        <caption class="sr-only">
          Staff accounts and their current access
        </caption>
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Role</th>
            <th>Access</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let user of staff">
            <td>{{ user.username }}</td>
            <td>{{ user.email }}</td>
            <td>{{ user.role }}</td>
            <td>
              <div class="staff-access">
                <span>{{ user.active ? 'Enabled' : 'Disabled' }}</span>
                <button
                  type="button"
                  class="btn btn-outline-primary btn-sm"
                  *ngIf="user.id !== users.userInfo?.id"
                  (click)="toggle(user)"
                >
                  {{ user.active ? 'Disable' : 'Enable' }}
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div></ng-container
  >
</div>
