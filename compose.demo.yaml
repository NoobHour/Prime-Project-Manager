# Standalone demo project: never merge this file with the normal application's Compose file.
name: ppm-demo
services:
  demo:
    build: .
    restart: unless-stopped
    init: true
    command: ['node', 'tools/sandbox.cjs']
    environment:
      MGMT_HOST: '0.0.0.0'
      MGMT_PORT: '3333'
      MGMT_ORIGIN: ${PPM_DEMO_ORIGIN:-http://localhost:3336}
      MGMT_SANDBOX_RESET_MINUTES: ${PPM_DEMO_RESET_MINUTES:-60}
    ports:
      - '127.0.0.1:${PPM_DEMO_PORT:-3336}:3333'
    # Fictional records disappear on reset or container recreation; no production volume is mounted.
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    mem_limit: 512m
    cpus: 1.0
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
