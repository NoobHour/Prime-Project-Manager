<div class="panel-header workspace-header">
  <a routerLink="/" class="workspace-brand"
    ><img [src]="brand.logo" alt="" width="44" height="44" /><span>{{
      brand.name
    }}</span></a
  >
  <div class="workspace-account" *ngIf="isAuth">
    <details class="account-menu"><summary class="btn btn-outline-primary">{{ user?.username }} · Account</summary><div class="menu-options">
      <a [routerLink]="'/@' + user?.username">Profile</a><a routerLink="/settings">Profile settings</a>
      <a *ngIf="user?.role === 'admin'" routerLink="/workspace">Workspace settings</a><a *ngIf="user?.role === 'admin'" routerLink="/register">Staff accounts</a><button class="btn btn-outline-primary" (click)="logout()">Logout</button>
    </div></details>
  </div>
</div>
